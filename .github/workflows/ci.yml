name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install pytest ruff
      - name: Lint the maintained check surface
        run: >-
          python -m ruff check
          ciip/__init__.py
          ciip/open_clip_train/accumulation.py
          ciip/open_clip_train/batches.py
          ciip/open_clip_train/checkpointing.py
          ciip/open_clip_train/config_validation.py
          ciip/open_clip_train/objectives.py
          ciip/open_clip_train/optimizer.py
          ciip/open_clip_train/utils.py
          tests
      - name: Run fast tests
        run: python -m pytest -q
