[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ciip"
version = "0.1.0"
description = "Multimodal geospatial foundation-model pretraining and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "CIIP contributors" }]
dependencies = [
  "numpy>=1.26",
  "packaging>=23",
  "pillow>=10",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
  "comet-ml>=3.44",
  "hydra-core>=1.3",
  "open-clip-torch>=2.26",
  "pandas>=2.0",
  "timm>=1.0",
  "torchgeo>=0.6",
  "zarr>=2.16,<3",
]
eval = [
  "matplotlib>=3.8",
  "pandas>=2.0",
  "pyyaml>=6",
  "scikit-dimension>=0.3",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "torchgeo>=0.6",
]
viz = [
  "matplotlib>=3.8",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "umap-learn>=0.5",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["ciip*", "clip*"]

[tool.setuptools.package-data]
ciip = ["open_clip_train/configs/**/*.yaml"]
clip = ["*.txt.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires optional ML dependencies or substantial resources",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
