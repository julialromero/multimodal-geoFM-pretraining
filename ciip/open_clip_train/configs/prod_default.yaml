# config file for main (trainer)
# example: dir: /path/to/dir
# please use the exact name of the arg attribute as the name of the variable
io:
  checkpoint_path: checkpoints
  save_frequency: 5
  save_logs: True
  logs: /path/to/logs #base path for logs 
  log_every_n_steps: 50
  wandb: False
  comet_ml: True
  resume:

comet: #personal
  api_key: 
  project_name: general
  workspace:

model:
  framework: resnet50 #options are resnet18, resnet50, modified_resnet, transformer
  pretrain:
    load: True
    s1_weights: "MOCO" # Only support for resnet50. S1: MOCO
    s2_weights: "MOCO" # Only support for resnet50. S2: MOCO, DINO
  embed_dim: 512
  s1_layers: [3, 4, 6, 3]
  s2_layers: [3, 4, 6, 3]
  width: 32
  s1_patch_size: 16
  s2_patch_size: 16
  s1_resolution: 224
  s2_resolution: 224
  s1_bands: [1, 2]
  s2_bands: [1, 2, 3, 4, 5, 6, 7, 8, 8A, 9, 10, 11, 12] # if using sentinel-2 s2a tier, band 10 is no longer present
  #TODO we should use mixed prevision
  precision: 'amp' #'fp16'
  grad_clip_norm: ~
  skip_scheduler: False
  # distill_model:
  # distributed: 
  workers: 6 # workers per GPU


#TODO: loss params

datamodule:
  batch_size: 256 # batch sizer per GPU
  world_size: 2
  rank: 
  horovod: False
  local_rank:
  local_loss: True
  gather_with_grad: True
  distributed:
  device:
  distill:
  siglip:
  dist_backend:


  dist_url:
  no_set_device_rank:

dataset:
  dataset_type: ssl4eo
  # train_data is true for training and false for validation
  train_data: True
  dimension: 264
  root: /local/ms-data/SSL4EO/ #TODO: documentation about proper directory to run from
  s2_tier: s2c # TOA data from Sentinel-2 tier 1C; s2a for BOA corrections
  use_transforms: False

train:
  # fraction of data to use for validation
  # device: cuda
  use_val: False
  val_frac: 0.0
  epochs: 100
  lr: 0.0001
  wd: 0.2
  warmup: 10000
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  val_frequency: 1
  accum_freq: 5
  save_logs: True
  name: ciip_test
  delete_previous_checkpoint: False
  save_most_recent: False
  debug: False # for logger
  seed: 56

#other placeholders
remote_sync:
remote_sync_frequency:
remote_sync_protocol:
report_to:
log_path:
log_local:
log_level:
wandb:
tensorboard:
tensorboard_path:
distill_pretrained:
distill_model:
distill:
siglip:
grad_checkpointing:
use_bn_sync:
ddp_static_graph:
trace:
save_logs:
torchcompile:
copy_codebase: