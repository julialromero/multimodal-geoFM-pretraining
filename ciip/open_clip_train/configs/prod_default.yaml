# config file for main (trainer)
# example: dir: /path/to/dir
# please use the exact name of the arg attribute as the name of the variable
io:
  checkpoint_path: checkpoints
  save_frequency: 5
  save_logs: True
  log_every_n_steps: 50
  wandb: False
  comet_ml: True

comet: personal

model:
  framework: resnet50 #options are resnet18, resnet50, modified_resnet, transformer
  pretrain:
    load: True
    s1_weights: "MOCO" # Only support for resnet50. S1: MOCO
    s2_weights: "MOCO" # Only support for resnet50. S2: MOCO, DINO
  embed_dim: 512
  s1_layers: [3, 4, 6, 3]
  s2_layers: [3, 4, 6, 3]
  width: 32
  s1_patch_size: 16
  s2_patch_size: 16
  s1_resolution: 224
  s2_resolution: 224
  s1_bands: [1, 2]
  s2_bands: [1, 2, 3, 4, 5, 6, 7, 8, 8A, 9, 10, 11, 12] # if using sentinel-2 s2a tier, band 10 is no longer present
  #TODO we should use mixed prevision
  precision: 'fp16'
  grad_clip_norm: ~
  accum_freq: 1
  skip_scheduler: False
  distill:
  distributed: False
  workers: 4


#TODO: loss params

datamodule:
  batch_size: 128
  world_size: 1
  rank: 0
  horovod: False

dataset:
  dataset_type: ssl4eo
  # train_data is true for training and false for validation
  train_data: True
  dimension: 264
  root: /local/ms-data/SSL4EO/ #TODO: documentation about proper directory to run from
  s2_tier: s2c # TOA data from Sentinel-2 tier 1C; s2a for BOA corrections
  use_transforms: False

train:
  # fraction of data to use for validation
  device: cuda
  use_val: False
  val_frac: 0.0
  epochs: 100
  lr: 0.0001
  wd: 0.2
  warmup: 10000
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  val_frequency: 1
  accum_freq: 5
  save_logs: True
  name: ciip_test
  delete_previous_checkpoint: False
  save_most_recent: False
  debug: False