# config file for main (trainer)
# example: dir: /path/to/dir
# please use the exact name of the arg attribute as the name of the variable
io:
  checkpoint_path: checkpoints
  save_frequency: 5
  save_logs: True
  logs: # SET IN SLURM SCRIPT /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/ #base path for logs 
  mem_snapshots: /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/mem_snapshots/
  log_every_n_steps: 50
  wandb: False
  comet_ml: False
  resume: /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/2025-10-02_11-17-32-test-compute/2025_10_02-12_18_11-model_resnet50-lr_5e-05-b_128-j_4-p_amp/checkpoints/epoch_5.pt
  #  /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/2025-09-09_19-21-57-test-compute/2025_09_09-19_29_56-model_resnet50-lr_5e-05-b_128-j_4-p_amp/checkpoints/epoch_235.pt
  # /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/2025-09-09_13-53-49-test-compute/2025_09_09-14_01_28-model_resnet50-lr_5e-05-b_128-j_4-p_amp/checkpoints/epoch_170.pt
  # /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/2025-08-15_12-16-54-test-compute/2025_08_15-12_24_38-model_resnet50-lr_5e-05-b_128-j_4-p_amp/checkpoints/epoch_100.pt
  # /work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/2025-08-06_14-45-31-test-compute/2025_08_06-14_53_09-model_resnet50-lr_5e-05-b_128-j_4-p_amp/checkpoints/epoch_59.pt
  #/work/nvme/bekj/jromero5/ciip/logs/4nodes-tests/2025-08-05_09-56-35-test-compute/2025_08_05-10_05_41-model_resnet50-lr_5e-05-b_256-j_4-p_amp/checkpoints/epoch_48.pt
comet: #personal
  api_key: 
  project_name: general
  workspace:

model:
  framework: resnet50 #options are resnet18, resnet50, modified_resnet, transformer
  pretrain:
    load: False
    s1_weights: "MOCO" # Only support for resnet50. S1: MOCO
    s2_weights: "MOCO" # Only support for resnet50. S2: MOCO, DINO
  embed_dim: 1024
  s1_layers: [3, 4, 6, 3]
  s2_layers: [3, 4, 6, 3]
  width: 32
  s1_patch_size: 16
  s2_patch_size: 16
  s1_resolution: 224
  s2_resolution: 224
  s1_bands: [1, 2]
  s2_bands: [1, 2, 3, 4, 5, 6, 7, 8, 8A, 9, 10, 11, 12] # if using sentinel-2 s2a tier, band 10 is no longer present
  #TODO we should use mixed prevision
  precision: 'amp' #'fp16'
  grad_clip_norm: 1
  skip_scheduler: False
  # distill_model:
  # distributed: 
  workers: 4


#TODO: loss params
loss:
  local_loss: True
  gather_with_grad: True
  cache_labels: True
  vc_enabled: True
  vc_weight: 0.4
  vc_gamma: 1.0
  vc_covariance_weights: [1.0, 1.0]

datamodule:
  batch_size: 128 # BS per GPU
  world_size: 
  rank: 
  horovod: False
  local_loss: True
  gather_with_grad: True
  distributed:
  device:
  distill:
  siglip:
  dist_backend: 
  dist_url: 
  no_set_device_rank:
  local_rank:


dataset:
  dataset_type: ssl4eo
  # train_data is true for training and false for validation
  train_data: True
  dimension: 224
  root: /tmp/jromero5 #TEST DATA -> /projects/bekj/jromero5/ciip/data #removed test data 
  s2_tier: s2c # TOA data from Sentinel-2 tier 1C; s2a for BOA corrections
  use_transforms: False

train:
  # fraction of data to use for validation
  # device: cuda
  use_val: False
  val_frac: 0.0
  epochs: 350
  lr: 0.001
  wd: 0.02
  warmup: 5000
  beta1: 0.9
  beta2: 0.98
  eps: 1.0e-8
  val_frequency: 1
  accum_freq: 5
  save_logs: True
  name: ciip_test
  delete_previous_checkpoint: False
  save_most_recent: False
  debug: False # for logger
  seed: 56
  apply_orthogonal_mapping: False

#other placeholders
remote_sync:
remote_sync_frequency:
remote_sync_protocol:
report_to:
log_path:
log_local:
log_level:
wandb:
tensorboard:
tensorboard_path:
distill_pretrained:
distill_model:
