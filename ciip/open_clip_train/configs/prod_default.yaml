model:
  # encoder_pair controls which encoders are built by the data-parallel runner.
  # options:
  #   default    -> S1 + S2 (CIIP)
  #   s2_text    -> S2 + text
  #   s1s2_text  -> S1 + S2 + text (three-way alignment)
  encoder_pair: default #s1s2_text #default #s2_text #s2
  # Optional checkpoints for initializing encoders
  s1s2_ciip_checkpoint: #/local/ms-data/SSL4EO/model/2025_11_22-08_31_28-model_resnet50-lr_0.001-b_6-j_6-p_amp_bfloat16/checkpoints/epoch_40.pt # path to CIIP checkpoint containing encoder_s1 and encoder_s2 weights
  text_checkpoint: #/home/juro4948/ciip/ciip/Llama3_MS_CLIP_weights.pt      # path to checkpoint containing text encoder weights
  framework: transformer #options are resnet18, resnet50, modified_resnet, transformer
  pretrain:
    load: False
    s1_weights: "MOCO" # Only support for resnet50. S1: MOCO
    s2_weights: "MOCO" # Only support for resnet50. S2: MOCO, DINO
  embed_dim: 512 #1024 # transformer: 512 #1024
  # pre_projection_dim: 2048
  s1_layers: 12 #[3, 4, 6, 3] # transformer:12
  s2_layers: 12 #[3, 4, 6, 3] # transformer:12

  width: 768 # 32 # transformer:768
  s2_ciip_checkpoint: #/local/ms-data/SSL4EO/model/2025_11_29-20_57_06-model_resnet50-lr_0.001-b_6-j_6-p_amp_bfloat16/checkpoints/epoch_20.pt  # optional path to CIIP checkpoint; when set with encoder_pair=s2_text, only S2 weights are loaded
  s1_patch_size: 16 # TODO: test 32
  s2_patch_size: 16
  patch_masking: True
  patch_mask_ratio: 0.7
  s1_resolution: 224
  s2_resolution: 224
  s1_bands: [1, 2]
  s2_bands: [1, 2, 3, 4, 5, 6, 7, 8, 8A, 9, 11, 12] # if using sentinel-2 s2a tier, band 10 is no longer present
  text:
    context_length: 77
    vocab_size: 49408
    transformer_width: 512
    transformer_heads: 8
    transformer_layers: 12
    load_ms_clip: True
  #TODO we should use mixed prevision
  precision: 'amp_bfloat16' #'amp' #
  grad_clip_norm: 1 #set to 1 when training with amp
  skip_scheduler: False
  # distill_model:
  # distributed: 
  workers: 16 # workers per GPU


#TODO: loss params
loss:
  local_loss: True
  gather_with_grad: True
  cache_labels: True
  contrastive_weight: 1

  batch_uniformity_enabled: False
  batch_uniformity_weight: 0.02

  vc_reg_enabled: False
  vc_weight: 0.15
  vc_gamma: 1.0
  vc_covariance_weights: [1.0, 1.0]

  matryoshka_enabled: False
  matryoshka_weight: 1.0
  matryoshka_dims: [8, 16, 64, 128, 256, 512] #, 1024]
  matryoshka_weights: [0.166, 0.166, 0.166, 0.166, 0.166, 0.166] #, 0.125] #, 0.125]
  matryoshka_normalize: True # L2‑normalizes each sliced embedding
 
  hyperbolic: False
  curvature_init: 0.1
  learn_curv: True
  entail_weight: 0.0

recon:
  lambda: 0.1
  warmup_epochs: 5

datamodule:
  batch_size: 4 #2 #6 # batch size per GPU # 4 x 2 x 64 x 45 = 
  world_size:
  rank: 
  horovod: False
  local_rank:
  # local_loss: True
  # gather_with_grad: True
  distributed:
  device:
  distill:
  # siglip: True
  dist_backend:
  dist_url:
  no_set_device_rank:
  siglip: False #True

dataset:
  dataset_type: ssl4eo
  # train_data is true for training and false for validation
  train_data: True
  dimension: 224
  root: /work/nvme/bekj/jromero5/SSL4EOv1.1/train #/local/ms-data/SSL4EO/ #TODO: documentation about proper directory to run from
  s2_tier: S2L2A # TOA data from Sentinel-2 tier 1C; s2a for BOA corrections
  use_transforms: False
  # transforms are automatically used and defined in data.py get_transforms() and SSL4EO dataset
  
train:
  name: "2_07_2026" #12_27_2025 #12_14_2025_joint_ciip_s1s2_text
  # fraction of data to use for validation
  # device: cuda
  use_val: False
  val_frac: 0.0
  epochs: 300
  lr: 0.000125
  curvature_lr: 0.2
  wd: 0.01 #0.2
  warmup: 0
  warmup_epochs: 15
  beta1: 0.9
  beta2: 0.999
  eps: 1.0e-8
  val_frequency: 1
  accum_freq: 12
  save_logs: True
  
  delete_previous_checkpoint: False
  save_most_recent: False
  debug: False # for logger
  seed: 56
  apply_orthogonal_mapping: False

